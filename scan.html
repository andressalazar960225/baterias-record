<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Baterías Récord — Orden</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#0a0a0f;color:#f0f0f5;font-family:'DM Sans',sans-serif;min-height:100vh;padding-bottom:3rem;}

  .header{background:#12121a;border-bottom:1px solid #2a2a3d;padding:14px 20px;display:flex;align-items:center;gap:10px;}
  .logo-icon{width:32px;height:32px;background:#f5c518;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;}
  .logo-text{font-family:'Syne',sans-serif;font-weight:800;font-size:1rem;}
  .logo-sub{font-size:0.62rem;color:#6b6b8a;letter-spacing:0.12em;text-transform:uppercase;}

  .container{max-width:520px;margin:0 auto;padding:1.5rem 1rem;}

  .order-card{background:#12121a;border:1px solid #2a2a3d;border-radius:14px;padding:1.25rem;margin-bottom:1.25rem;}
  .order-id{font-size:0.7rem;color:#6b6b8a;font-family:monospace;margin-bottom:4px;}
  .order-name{font-family:'Syne',sans-serif;font-weight:800;font-size:1.3rem;margin-bottom:2px;}
  .order-phone{color:#6b6b8a;font-size:0.85rem;margin-bottom:1rem;}

  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.6rem;margin-bottom:1rem;}
  .info-item{background:#1a1a26;border-radius:8px;padding:9px 11px;}
  .info-item .k{font-size:0.65rem;color:#6b6b8a;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:2px;}
  .info-item .v{font-size:0.88rem;font-weight:600;color:#f0f0f5;}

  .badge{display:inline-block;padding:4px 12px;border-radius:999px;font-size:0.72rem;font-weight:700;letter-spacing:0.05em;}
  .badge-recibido{background:#1e3a5f;color:#60a5fa;}
  .badge-proceso{background:#3b2a05;color:#fbbf24;}
  .badge-listo{background:#052e16;color:#4ade80;}
  .badge-entregado{background:#1e1b4b;color:#a78bfa;}
  .badge-cancelado{background:#2d0a0a;color:#f87171;}

  .obs-box{background:#1a1a26;border-radius:8px;padding:12px;margin-bottom:1rem;}
  .obs-box .k{font-size:0.65rem;color:#6b6b8a;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:5px;}
  .obs-box p{font-size:0.88rem;color:#b0b0c8;line-height:1.6;}

  .section-title{font-size:0.7rem;color:#6b6b8a;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:0.75rem;font-weight:700;}

  /* PHOTOS */
  .photos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1rem;}
  .photo-thumb{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;border:1px solid #2a2a3d;cursor:pointer;}
  .photo-add{width:100%;aspect-ratio:1;border-radius:8px;border:2px dashed #2a2a3d;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:#1a1a26;color:#6b6b8a;font-size:0.75rem;gap:4px;transition:all .15s;}
  .photo-add:hover{border-color:#f5c518;color:#f5c518;}
  .photo-add span{font-size:1.5rem;}

  /* NOTES */
  .note-item{background:#1a1a26;border-left:3px solid #f5c518;border-radius:0 8px 8px 0;padding:10px 12px;margin-bottom:8px;font-size:0.85rem;color:#b0b0c8;line-height:1.5;}
  .note-add{display:flex;flex-direction:column;gap:8px;}
  .note-add textarea{background:#1a1a26;border:1px solid #2a2a3d;border-radius:8px;padding:10px 12px;color:#f0f0f5;font-size:0.88rem;outline:none;font-family:'DM Sans',sans-serif;resize:vertical;min-height:80px;transition:border .15s;}
  .note-add textarea:focus{border-color:#f5c518;}

  .btn-primary{width:100%;background:#f5c518;color:#000;border:none;padding:12px;border-radius:9px;font-family:'Syne',sans-serif;font-weight:800;font-size:0.95rem;cursor:pointer;transition:all .15s;}
  .btn-primary:hover{background:#e8a000;}
  .btn-primary:disabled{background:#2a2a3d;color:#6b6b8a;cursor:not-allowed;}

  .status-select{width:100%;background:#1a1a26;border:1px solid #2a2a3d;border-radius:8px;padding:11px 12px;color:#f0f0f5;font-size:0.9rem;outline:none;cursor:pointer;font-family:'DM Sans',sans-serif;margin-bottom:0.75rem;}
  .status-select:focus{border-color:#f5c518;}

  .spinner{width:28px;height:28px;border:3px solid #2a2a3d;border-top-color:#f5c518;border-radius:50%;animation:spin .7s linear infinite;margin:3rem auto;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .error-msg{text-align:center;padding:3rem 1rem;color:#f87171;}
  .success-toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#22c55e;color:#000;padding:10px 24px;border-radius:999px;font-weight:700;font-size:0.88rem;z-index:999;animation:fadeup .3s ease;}
  @keyframes fadeup{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}

  /* LIGHTBOX */
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:500;display:flex;align-items:center;justify-content:center;padding:1rem;}
  .lightbox img{max-width:100%;max-height:90vh;border-radius:8px;}
  .lightbox-close{position:absolute;top:1rem;right:1rem;background:#fff;border:none;border-radius:50%;width:36px;height:36px;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}
</style>
</head>
<body>

<div class="header">
  <div class="logo-icon">⚡</div>
  <div>
    <div class="logo-text">Baterías Récord</div>
    <div class="logo-sub">Battery Center · Revisión de Orden</div>
  </div>
</div>

<div class="container" id="container">
  <div class="spinner"></div>
</div>

<div id="lightbox" class="lightbox" style="display:none" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lb-img" src="" />
</div>

<script>
const SUPA_URL = "https://aavvptuojuxrlqwbbnbu.supabase.co";
const SUPA_KEY = "sb_publishable_83BuqtayE922CnSjM27Bmg_anpKra4f";
const HEADERS  = { "Content-Type":"application/json","apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY };

const params  = new URLSearchParams(location.search);
const orderId = params.get("id");
let order     = null;

const BADGE_CLASS = {"Recibido":"badge-recibido","En proceso":"badge-proceso","Listo":"badge-listo","Entregado":"badge-entregado","Cancelado":"badge-cancelado"};
const PRIORITY_COLOR = {Normal:"#6b7280",Urgente:"#f59e0b","Crítico":"#ef4444"};

async function dbFetch(path,opts={}) {
  const r = await fetch(SUPA_URL+"/rest/v1/"+path,{headers:HEADERS,...opts});
  if(!r.ok){const e=await r.text();throw new Error(e);}
  return r.status===204?null:r.json();
}

const fmt = iso => iso ? new Date(iso).toLocaleString("es-EC",{dateStyle:"short",timeStyle:"short"}) : "—";
const nowISO = () => new Date().toISOString();

function toast(msg) {
  const el = document.createElement("div");
  el.className = "success-toast";
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2800);
}

async function load() {
  const c = document.getElementById("container");
  if (!orderId) { c.innerHTML = `<div class="error-msg">⚠️ Código QR inválido.<br>No se encontró ningún ID de orden.</div>`; return; }
  try {
    const rows = await dbFetch(`orders?id=eq.${orderId}`);
    if (!rows || rows.length === 0) { c.innerHTML = `<div class="error-msg">⚠️ No se encontró la orden #${orderId}.</div>`; return; }
    order = rows[0];
    render();
  } catch(e) {
    c.innerHTML = `<div class="error-msg">Error al cargar: ${e.message}</div>`;
  }
}

function render() {
  let photos = [];
  try { photos = JSON.parse(order.photos||"[]"); } catch{}
  let notes = [];
  try { notes = JSON.parse(order.reports||"[]"); } catch{}

  document.getElementById("container").innerHTML = `
    <!-- ORDEN -->
    <div class="order-card">
      <div class="order-id">ORDEN #${order.id}</div>
      <div class="order-name">${order.client||"—"}</div>
      <div class="order-phone">${order.phone||""}</div>
      <div style="margin-bottom:0.75rem;">
        <span class="badge ${BADGE_CLASS[order.status]||''}">${order.status}</span>
        <span style="margin-left:8px;font-size:0.82rem;font-weight:700;color:${PRIORITY_COLOR[order.priority]||'#6b7280'}">● ${order.priority}</span>
      </div>
      <div class="info-grid">
        ${[["Servicio",order.service],["Marca",order.brand],["Modelo",order.model],["N° Serie",order.serial],["Recibido",fmt(order.created)],["Valor",order.price?`$${parseFloat(order.price).toFixed(2)}`:"—"]].map(([k,v])=>`
          <div class="info-item"><div class="k">${k}</div><div class="v">${v||"—"}</div></div>`).join("")}
      </div>
      ${order.observations?`<div class="obs-box"><div class="k">Observaciones</div><p>${order.observations}</p></div>`:""}
    </div>

    <!-- CAMBIAR ESTADO -->
    <div style="margin-bottom:1.5rem;">
      <div class="section-title">Actualizar estado</div>
      <select class="status-select" id="status-sel">
        ${["Recibido","En proceso","Listo","Entregado","Cancelado"].map(s=>`<option ${s===order.status?"selected":""}>${s}</option>`).join("")}
      </select>
      <button class="btn-primary" onclick="saveStatus()" style="margin-bottom:0">💾 Guardar estado</button>
    </div>

    <!-- FOTOS -->
    <div style="margin-bottom:1.5rem;">
      <div class="section-title">Fotos de la revisión (${photos.length})</div>
      <div class="photos-grid" id="photos-grid">
        ${photos.map((p,i)=>`<img class="photo-thumb" src="${p}" onclick="openLightbox('${p}')" />`).join("")}
        <label class="photo-add">
          <span>📷</span>
          <span>Agregar foto</span>
          <input type="file" accept="image/*" capture="environment" style="display:none" onchange="handlePhoto(this)" />
        </label>
      </div>
    </div>

    <!-- NOTAS -->
    <div style="margin-bottom:1.5rem;">
      <div class="section-title">Notas técnicas (${notes.length})</div>
      <div id="notes-list" style="margin-bottom:0.75rem;">
        ${notes.length ? notes.map((n,i)=>`<div class="note-item"><span style="color:#6b6b8a;font-size:0.75rem">#${i+1} · </span>${n}</div>`).join("") : `<div style="color:#6b6b8a;font-size:0.85rem;margin-bottom:8px;">Sin notas aún.</div>`}
      </div>
      <div class="note-add">
        <textarea id="note-input" placeholder="Escribe una nota técnica, diagnóstico o reporte…"></textarea>
        <button class="btn-primary" onclick="saveNote()">+ Guardar nota</button>
      </div>
    </div>
  `;
}

async function saveStatus() {
  const sel = document.getElementById("status-sel");
  const newStatus = sel.value;
  try {
    await dbFetch(`orders?id=eq.${orderId}`,{method:"PATCH",headers:{...HEADERS,"Prefer":"return=representation"},body:JSON.stringify({status:newStatus,updated:nowISO()})});
    order.status = newStatus;
    toast("✅ Estado actualizado correctamente");
    render();
  } catch(e) { alert("Error: "+e.message); }
}

async function handlePhoto(input) {
  const file = input.files[0];
  if (!file) return;
  const MAX = 800;
  const reader = new FileReader();
  reader.onload = async (ev) => {
    // resize
    const img = new Image();
    img.onload = async () => {
      const canvas = document.createElement("canvas");
      let w = img.width, h = img.height;
      if (w > MAX) { h = Math.round(h*MAX/w); w = MAX; }
      if (h > MAX) { w = Math.round(w*MAX/h); h = MAX; }
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img,0,0,w,h);
      const b64 = canvas.toDataURL("image/jpeg",0.75);
      let photos = [];
      try { photos = JSON.parse(order.photos||"[]"); } catch{}
      photos.push(b64);
      try {
        await dbFetch(`orders?id=eq.${orderId}`,{method:"PATCH",headers:{...HEADERS,"Prefer":"return=representation"},body:JSON.stringify({photos:JSON.stringify(photos),updated:nowISO()})});
        order.photos = JSON.stringify(photos);
        toast("📷 Foto guardada");
        render();
      } catch(e) { alert("Error al guardar foto: "+e.message); }
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

async function saveNote() {
  const input = document.getElementById("note-input");
  const text = input.value.trim();
  if (!text) return;
  let notes = [];
  try { notes = JSON.parse(order.reports||"[]"); } catch{}
  const ts = new Date().toLocaleString("es-EC",{dateStyle:"short",timeStyle:"short"});
  notes.push(`[${ts}] ${text}`);
  try {
    await dbFetch(`orders?id=eq.${orderId}`,{method:"PATCH",headers:{...HEADERS,"Prefer":"return=representation"},body:JSON.stringify({reports:JSON.stringify(notes),updated:nowISO()})});
    order.reports = JSON.stringify(notes);
    toast("✅ Nota guardada");
    render();
  } catch(e) { alert("Error: "+e.message); }
}

function openLightbox(src) {
  document.getElementById("lb-img").src = src;
  document.getElementById("lightbox").style.display = "flex";
}
function closeLightbox() {
  document.getElementById("lightbox").style.display = "none";
}

load();
</script>
</body>
</html>
